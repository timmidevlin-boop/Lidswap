<style>
  :root{
    --navy:#003349; --blue:#00A3E0; --lime:#C0DF16; --white:#FFFFFF;
    --bg:#f2f6f8; --card:#ffffff; --ink:#0b2733; --muted:#5c7d8a;
    --border:#dbe6eb; --red:#E05252; --purple:#9B59B6; --green:#27ae60; --warn:#ff9f1a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  header h1{font-size:18px;margin:0;color:var(--navy);letter-spacing:.2px}
  header .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
  .pill-btn{border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;}

  .scope-bar{display:flex;gap:8px;margin-bottom:14px;}
  .scope-bar button{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;}
  .scope-bar button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .scope-bar .cnt{display:block;font-size:15px;font-weight:800;margin-top:1px;}

  .progress-bar{height:7px;background:#e7eef1;border-radius:6px;overflow:hidden;margin-bottom:16px;}
  .progress-bar>div{height:100%;background:linear-gradient(90deg,var(--lime),#8fb00e);border-radius:6px;transition:width .2s ease;}
  .progress-lbl{font-size:12px;color:var(--muted);margin:-11px 0 14px;text-align:right;font-weight:600;}

  /* Home / list screen */
  #screen-home{display:block;}
  #screen-stop{display:none;}
  #screen-empty{display:none;text-align:center;padding:60px 20px;color:var(--muted);}
  #screen-empty .big{font-size:40px;margin-bottom:8px;}

  .stop-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;position:relative;}
  .stop-card:active{background:#f7fafb;}
  .stop-card .addr{font-weight:800;color:var(--navy);font-size:15.5px;}
  .stop-card .sub{color:var(--muted);font-size:12.5px;margin-top:1px;}
  .stop-card .note{display:block;color:#8a5a00;font-size:12px;margin-top:5px;}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:5px;}
  .chip.type-revisit{background:#fdecec;color:#c23a3a;}
  .chip.type-clean{background:#f3e9f8;color:#7d3f9c;}
  .chip.coll-today{background:#eaf9ee;color:var(--green);}
  .chip.coll-soon{background:#fff6e0;color:#a97300;}
  .stop-card .meta{margin-top:8px;font-size:11.5px;color:var(--muted);}

  /* Stop / action screen */
  .stop-top{margin-bottom:14px;}
  .stop-top .back{font-size:13px;color:var(--muted);font-weight:700;cursor:pointer;margin-bottom:10px;display:inline-block;}
  .stop-top .addr{font-size:22px;font-weight:800;color:var(--navy);line-height:1.2;}
  .stop-top .sub{color:var(--muted);font-size:14px;margin-top:2px;}
  .stop-alert{margin-top:12px;background:#fff6e0;border:1px solid rgba(169,115,0,.25);border-radius:10px;padding:10px 12px;font-size:13px;color:#8a5a00;font-weight:600;}
  .stop-meta-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  .btn-nav{display:flex;align-items:center;gap:12px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:800;cursor:pointer;margin-top:18px;}
  .btn-nav small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:1px;}
  .nav-glyph{font-size:20px;}

  .outcomes{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
  .btn-outcome{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff;}
  .btn-outcome .em{font-size:19px;}
  .btn-outcome small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:1px;}
  .btn-outcome.lime{background:var(--lime);color:#001e2e;}
  .btn-outcome.red{background:var(--red);}
  .btn-outcome.purple{background:var(--purple);}
  .btn-outcome.grey{background:#fff;color:var(--muted);border:1px solid var(--border);}

  /* Modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,20,30,.5);z-index:50;align-items:flex-end;justify-content:center;}
  .modal.on{display:flex;}
  .msheet{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;}
  .msheet h3{margin:0 0 4px;font-size:17px;color:var(--navy);}
  .msheet .m-sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .mta{width:100%;min-height:70px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:12px;}
  .mbtns{display:flex;gap:8px;}
  .mbtn{flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .mbtn-c{background:#f2f6f8;color:var(--muted);}
  .mbtn-ok{background:var(--lime);color:#001e2e;}

  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:11px;}
  .export-bar{display:flex;gap:8px;margin-top:18px;}
  .export-bar button{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;}
.tab-bar{display:flex;gap:0;margin:14px 0 10px;border-bottom:2px solid var(--border);}
.tab-bar button{flex:1;border:0;background:none;padding:11px 8px;font-size:14px;font-weight:700;color:#6b7c88;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-bar button.active{color:var(--navy);border-bottom-color:#00A3E0;}
.tab-bar .cnt{display:inline-block;margin-left:6px;background:#e8eef2;color:var(--navy);border-radius:10px;padding:1px 8px;font-size:12px;}
.tab-bar button.active .cnt{background:#00A3E0;color:#fff;}
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-home">
    <header>
      <div>
        <h1>LidSwap Revisit Run</h1>
        <p class="sub">Follow-up swaps · Moira Shire Council</p>
      </div>
      <button class="pill-btn" id="export-btn">&#8595; Export</button>
    </header>

    <div class="tab-bar" id="tab-bar">
      <button data-tab="revisit" class="active">Revisits<span class="cnt" id="tcnt-revisit">0</span></button>
      <button data-tab="clean">Cleanaway<span class="cnt" id="tcnt-clean">0</span></button>
    </div>

    <div class="scope-bar" id="scope-bar">
      <button data-scope="today" class="active">Due Today<span class="cnt" id="cnt-today">0</span></button>
      <button data-scope="soon">Due Soon<span class="cnt" id="cnt-soon">0</span></button>
      <button data-scope="all">All Open<span class="cnt" id="cnt-all">0</span></button>
    </div>

    <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <div class="progress-lbl" id="progress-lbl"></div>

    <div id="list-wrap"></div>

    <div id="screen-empty">
      <div class="big">&#127881;</div>
      <div style="font-weight:700;color:var(--navy);font-size:15px;margin-bottom:4px">Nothing in this list</div>
      <div>Try "All Open" to see every outstanding follow-up.</div>
    </div>

    <footer>Moira Shire Council · LidSwap Program · Created by Tim Devlin using Numa AI</footer>
  </div>

  <div id="screen-stop">
    <div class="stop-top">
      <span class="back" id="btn-back">&#8592; Back to list</span>
      <div class="addr" id="s-addr"></div>
      <div class="sub" id="s-sub"></div>
      <div class="stop-meta-row" id="s-chips"></div>
      <div class="stop-alert" id="s-alert" style="display:none"></div>
    </div>

    <button class="btn-nav" id="btn-nav" aria-label="Open turn-by-turn directions in Google Maps">
      <span class="nav-glyph">&#10148;</span>
      <span><b>Navigate in Google Maps</b><small>Turn-by-turn from your current location</small></span>
    </button>

    <div class="outcomes">
      <button class="btn-outcome lime" id="btn-swapped">
        <span class="em">&#10003;</span><span>Swapped<small>Lid replaced this visit</small></span>
      </button>
      <button class="btn-outcome purple" id="btn-replaced">
        <span class="em">&#128230;</span><span>Bin Replaced<small>Whole bin swapped/replaced</small></span>
      </button>
      <button class="btn-outcome red" id="btn-noaccess">
        <span class="em">&#128683;</span><span>Still No Access<small>Same issue as last time</small></span>
      </button>
      <button class="btn-outcome grey" id="btn-skip">
        <span class="em">&#8635;</span><span>Skip for now<small>Leave open, come back later</small></span>
      </button>
    </div>
  </div>

</div>

<!-- NOTE MODAL (optional note before saving outcome) -->
<div id="m-note" class="modal">
  <div class="msheet">
    <h3 id="m-note-title">Add a note?</h3>
    <div class="m-sub" id="m-note-sub"></div>
    <textarea class="mta" id="m-note-ta" placeholder="Optional — e.g. resident spoke to crew, new bin dropped off..."></textarea>
    <div class="mbtns">
      <button class="mbtn mbtn-c" id="m-note-cancel">Cancel</button>
      <button class="mbtn mbtn-ok" id="m-note-save">Save &amp; Continue</button>
    </div>
  </div>
</div>

<script>
var D = JSON.parse(document.getElementById('app-data').textContent);
/* Shared storage key with the Revisit & Cleanaway Tracker — marking a stop
   here also marks it done there, and vice versa. */
var STORE_KEY = 'lidswap-followup-status-v1';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadStatuses(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStatuses(obj){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }catch(e){} }
/* Baseline from field-run export 2026-10-07; device-saved updates override it. */
var BASELINE = {"r0": "done", "r1": "done", "r2": "done", "r13": "done", "r14": "done", "r15": "done", "r16": "done", "r17": "done", "r22": "done", "r23": "done", "r24": "done", "r25": "done", "r26": "done", "r27": "done", "r28": "done", "r29": "done", "r30": "done", "r31": "done", "r32": "done", "r33": "done", "r34": "done", "r35": "done", "r36": "done", "r37": "done", "r38": "done", "r39": "done", "r40": "done", "r41": "done", "r44": "done", "r45": "noaccess", "r46": "done", "r47": "noaccess", "r48": "noaccess", "r49": "done", "r50": "done", "r51": "noaccess", "r52": "done", "r53": "done", "r56": "done"};
var BASELINE_NOTES = {};
var statuses = Object.assign({}, BASELINE, loadStatuses());
function statusOf(id){ return statuses[id] || 'open'; }

var allItems = [];
D.revisit.forEach(function(r){ r._type='revisit'; allItems.push(r); });
D.cleanaway.forEach(function(r){ r._type='clean'; allItems.push(r); });

/* ── Collection-day estimate: fortnightly (14-day) cycle from the date the
   stop was originally missed, same logic as the Tracker. ── */
function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function collectionInfo(missedDateStr){
  var missed = new Date(missedDateStr+'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var diff = daysBetween(missed, today);
  if(diff < 0) return null;
  var rem = diff % 14;
  if(rem === 0) return {status:'today'};
  var daysUntil = 14 - rem;
  if(daysUntil <= 2) return {status:'soon', daysUntil:daysUntil};
  return null;
}
function fmtDate(d){
  var dt = new Date(d+'T00:00:00');
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[dt.getDay()]+' '+dt.getDate()+' '+mons[dt.getMonth()];
}

var state = { scope:'today', tab:'revisit' };
function tabItems(){ return allItems.filter(function(i){ return i._type===state.tab; }); }
var curItem = null;
var _pendingOutcome = null; // outcome awaiting note confirmation

function openItemsForScope(scope){
  var open = tabItems().filter(function(i){ return statusOf(i.id)==='open'; });
  if(scope==='all') return open;
  return open.filter(function(i){
    var c = collectionInfo(i.date);
    if(!c) return false;
    if(scope==='today') return c.status==='today';
    if(scope==='soon') return c.status==='soon';
    return false;
  });
}

function updateCounts(){
  ['revisit','clean'].forEach(function(t){
    document.getElementById('tcnt-'+t).textContent = allItems.filter(function(i){ return i._type===t && statusOf(i.id)==='open'; }).length;
  });
  var open = tabItems().filter(function(i){ return statusOf(i.id)==='open'; });
  var cToday = open.filter(function(i){ var c=collectionInfo(i.date); return c && c.status==='today'; }).length;
  var cSoon  = open.filter(function(i){ var c=collectionInfo(i.date); return c && c.status==='soon'; }).length;
  document.getElementById('cnt-today').textContent = cToday;
  document.getElementById('cnt-soon').textContent = cSoon;
  document.getElementById('cnt-all').textContent = open.length;

  var total = tabItems().length;
  var done = tabItems().filter(function(i){ return statusOf(i.id)!=='open'; }).length;
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-lbl').textContent = done+' / '+total+' '+(state.tab==='clean'?'Cleanaway':'revisit')+' follow-ups actioned';
}

function renderHome(){
  updateCounts();
  var items = openItemsForScope(state.scope);
  // sort: collection-day-today first, then soonest, then oldest missed date
  items.sort(function(a,b){
    var ca=collectionInfo(a.date), cb=collectionInfo(b.date);
    var pa = ca && ca.status==='today' ? 0 : (ca && ca.status==='soon' ? 1 : 2);
    var pb = cb && cb.status==='today' ? 0 : (cb && cb.status==='soon' ? 1 : 2);
    if(pa!==pb) return pa-pb;
    return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
  });

  var listWrap = document.getElementById('list-wrap');
  var emptyEl = document.getElementById('screen-empty');
  if(!items.length){
    listWrap.innerHTML='';
    emptyEl.style.display='block';
    return;
  }
  emptyEl.style.display='none';

  listWrap.innerHTML = items.map(function(i){
    var typeChip = i._type==='revisit' ? '<span class="chip type-revisit">Revisit</span>' : '<span class="chip type-clean">Cleanaway</span>';
    var c = collectionInfo(i.date);
    var collChip = '';
    if(c && c.status==='today') collChip = '<span class="chip coll-today">Collection today</span>';
    else if(c && c.status==='soon') collChip = '<span class="chip coll-soon">In '+c.daysUntil+' day'+(c.daysUntil>1?'s':'')+'</span>';
    return '<div class="stop-card" data-id="'+i.id+'">'
      +'<div class="addr">'+esc(i.address)+'</div>'
      +'<div class="sub">'+esc(i.suburb)+'</div>'
      +(i.note ? '<span class="note">'+esc(i.note)+'</span>' : '')
      +'<div class="meta">'+typeChip+collChip+' &middot; Missed '+esc(fmtDate(i.date))+' &middot; Crew '+esc(i.crew)+'</div>'
      +'</div>';
  }).join('');

  listWrap.querySelectorAll('.stop-card').forEach(function(card){
    card.addEventListener('click', function(){
      var id = this.getAttribute('data-id');
      var item = allItems.filter(function(x){ return x.id===id; })[0];
      if(item) openStop(item);
    });
  });
}

document.getElementById('tab-bar').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  state.tab = btn.getAttribute('data-tab');
  renderHome();
});

document.getElementById('scope-bar').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  state.scope = btn.getAttribute('data-scope');
  renderHome();
});

/* ── Stop / action screen ── */
function openStop(item){
  curItem = item;
  document.getElementById('screen-home').style.display='none';
  document.getElementById('screen-stop').style.display='block';
  document.getElementById('s-addr').textContent = item.address;
  document.getElementById('s-sub').textContent = item.suburb;

  var chips = document.getElementById('s-chips');
  var typeChip = item._type==='revisit' ? '<span class="chip type-revisit">Revisit</span>' : '<span class="chip type-clean">Cleanaway</span>';
  var c = collectionInfo(item.date);
  var collChip = '';
  if(c && c.status==='today') collChip = '<span class="chip coll-today">Collection today</span>';
  else if(c && c.status==='soon') collChip = '<span class="chip coll-soon">In '+c.daysUntil+' day'+(c.daysUntil>1?'s':'')+'</span>';
  chips.innerHTML = typeChip + collChip;

  var alertEl = document.getElementById('s-alert');
  if(item.note){
    alertEl.style.display='block';
    alertEl.textContent = 'Missed '+fmtDate(item.date)+' (Crew '+item.crew+') — '+item.note;
  } else {
    alertEl.style.display='block';
    alertEl.textContent = 'Missed '+fmtDate(item.date)+' (Crew '+item.crew+') — no reason logged';
  }

  // Build Google Maps nav URL. No fixed origin: Google Maps uses your live
  // location as the starting point when "origin" is left off, same as
  // tapping "Directions" from the current-location blue dot.
  var destParam = encodeURIComponent(item.address+', '+item.suburb+' VIC, Australia');
  var isIOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(/Mac/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  var navUrl, navFallback=null;
  if(isIOS){
    navUrl = "comgooglemaps://?daddr="+destParam+"&directionsmode=driving";
    navFallback = "https://www.google.com/maps/dir/?api=1&destination="+destParam+"&travelmode=driving";
  } else {
    navUrl = "https://www.google.com/maps/dir/?api=1&destination="+destParam+"&travelmode=driving";
  }
  document.getElementById('btn-nav').onclick = function(){
    if(navFallback){
      var didOpen=false;
      var t=setTimeout(function(){ if(!didOpen) window.location.href=navFallback; },1500);
      var onBlur=function(){ didOpen=true; clearTimeout(t); window.removeEventListener('blur',onBlur); };
      window.addEventListener('blur',onBlur);
      window.location.href=navUrl;
    } else {
      window.location.href=navUrl;
    }
  };

  window.scrollTo(0,0);
}

function goHome(){
  document.getElementById('screen-stop').style.display='none';
  document.getElementById('screen-home').style.display='block';
  curItem = null;
  renderHome();
}
document.getElementById('btn-back').addEventListener('click', goHome);

/* ── Outcomes ── */
var OUTCOME_STATUS = { swapped:'done', replaced:'replaced', noaccess:'noaccess' };
var OUTCOME_LABEL  = { swapped:'Swapped', replaced:'Bin Replaced', noaccess:'Still No Access' };

function askNote(outcomeKey){
  _pendingOutcome = outcomeKey;
  document.getElementById('m-note-title').textContent = OUTCOME_LABEL[outcomeKey]+' — add a note?';
  document.getElementById('m-note-sub').textContent = curItem.address+', '+curItem.suburb;
  document.getElementById('m-note-ta').value = '';
  document.getElementById('m-note').classList.add('on');
}
document.getElementById('btn-swapped').addEventListener('click', function(){ askNote('swapped'); });
document.getElementById('btn-replaced').addEventListener('click', function(){ askNote('replaced'); });
document.getElementById('btn-noaccess').addEventListener('click', function(){ askNote('noaccess'); });
document.getElementById('btn-skip').addEventListener('click', function(){ goHome(); });

document.getElementById('m-note-cancel').addEventListener('click', function(){
  document.getElementById('m-note').classList.remove('on');
  _pendingOutcome = null;
});
document.getElementById('m-note-save').addEventListener('click', function(){
  var note = document.getElementById('m-note-ta').value.trim();
  document.getElementById('m-note').classList.remove('on');
  if(_pendingOutcome && curItem){
    statuses[curItem.id] = OUTCOME_STATUS[_pendingOutcome];
    saveStatuses(statuses);
    if(note){
      // store the field-run note alongside, prefixed so the Tracker's export shows it too
      var noteKey = curItem.id+'__note';
      var followupNotes = {};
      try{ followupNotes = JSON.parse(localStorage.getItem('lidswap-followup-notes-v1'))||{}; }catch(e){}
      followupNotes[curItem.id] = note;
      try{ localStorage.setItem('lidswap-followup-notes-v1', JSON.stringify(followupNotes)); }catch(e){}
    }
  }
  _pendingOutcome = null;
  goHome();
});

/* ── Export CSV ── */
function csvEscape(v){
  var s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
document.getElementById('export-btn').addEventListener('click', function(){
  var followupNotes = {};
  try{ followupNotes = JSON.parse(localStorage.getItem('lidswap-followup-notes-v1'))||{}; }catch(e){}
  followupNotes = Object.assign({}, BASELINE_NOTES, followupNotes);
  var header = ['Type','Address','Suburb','Missed On','Missed Crew','Original Note','Status','Field-Run Note'];
  var lines = [header.map(csvEscape).join(',')];
  allItems.forEach(function(i){
    var st = statusOf(i.id);
    var label = st==='open' ? 'Open' : (st==='done' ? 'Swapped' : (st==='replaced' ? 'Bin Replaced' : (st==='noaccess' ? 'Still No Access' : st)));
    var row = [
      i._type==='revisit' ? 'Revisit' : 'Cleanaway',
      i.address, i.suburb,
      fmtDate(i.date)+' 2026', i.crew,
      i.note||'', label, followupNotes[i.id]||''
    ];
    lines.push(row.map(csvEscape).join(','));
  });
  var csv = lines.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var today = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'lidswap_revisit_run_export_'+today+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

renderHome();
</script>
</body>
</html>
